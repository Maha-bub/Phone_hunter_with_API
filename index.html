<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Phone hunting use API</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
  </head>
  <body>
    <header></header>

    <main class="container text-center px-4 mt-4 justify-center">
      <!-- search section -->
      <div class="bg-gray-600 p-5 w-full rounded-t-md">
        <input
          id="search-field-data"
          class="input"
          type="search"
          required
          placeholder="Search"
        />
        <button onclick="handleSearch()" class="btn btn-accent">Search</button>
      </div>

      <h3 class="text-3xl font-bold">Phone Hunting</h3>
      <section class="text-center">
        <div id="loading-spiner" class="mt-20 hidden">
         
          <span class="loading w-8 loading-spinner text-neutral"></span>
         
         
        </div>
        <div>
          <div
            id="phone-card-container"
            class="grid grid-cols-1 mt-8 md:grid-cols-2 lg:grid-cols-3 gap-4 gap-y-4"
          ></div>

          <div id="show-all-container" class="justify-center mt-8 p-4 ">
            <button onclick="handleShowAll()" id="show-all-btn" class="btn btn-accent hidden">
              Show All
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer></footer>

    <script src="js/phone.js"></script>
  </body>
</html>
